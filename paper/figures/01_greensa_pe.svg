<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
  <title id="title">GreenSA conceptual processing element with two independently managed weight banks</title>
  <desc id="desc">Activation and partial sum data paths feed a gated multiply accumulate datapath. Two weight banks are selected for compute and have independent ON, deep sleep, and OFF controls. A PE wake signal propagates to neighboring processing elements.</desc>
  <defs>
    <style>
      .title{font:700 31px Arial,sans-serif;fill:#17253a}.sub{font:18px Arial,sans-serif;fill:#516075}
      .head{font:700 20px Arial,sans-serif;fill:#17253a}.body{font:18px Arial,sans-serif;fill:#17253a}
      .small{font:16px Arial,sans-serif;fill:#425269}.mono{font:17px 'DejaVu Sans Mono',monospace;fill:#17253a}
      .box{fill:#fff;stroke:#33465e;stroke-width:2.5}.logic{fill:#e8f0ff;stroke:#4775ba;stroke-width:2.5}
      .bank{fill:#fff0e5;stroke:#d58544;stroke-width:2.5}.ctrl{fill:#e7f5eb;stroke:#4f946b;stroke-width:2.5}
      .wire{fill:none;stroke:#2d435d;stroke-width:3;marker-end:url(#arrow)}
      .signal{fill:none;stroke:#458c62;stroke-width:3;marker-end:url(#greenArrow)}
      .weight{fill:none;stroke:#cd7934;stroke-width:3;marker-end:url(#orangeArrow)}
      .dash{stroke-dasharray:7 6}.label{font:16px Arial,sans-serif;fill:#33465e}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2d435d"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#458c62"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#cd7934"/></marker>
  </defs>
  <rect width="1280" height="790" fill="#fbfcfe"/>
  <text x="58" y="58" class="title">GreenSA: conceptual processing element</text>
  <text x="58" y="87" class="sub">Logical control and data paths for a weight-stationary PE with two weight banks</text>
  <rect x="102" y="112" width="1076" height="571" rx="24" fill="#f5f8fc" stroke="#71849a" stroke-width="2.5"/>
  <text x="127" y="151" class="head">PE (i, j)</text>

  <!-- Wave control: this is a control dependency, not a diagonal data wire. -->
  <text x="26" y="206" class="mono">PE_on in</text>
  <path d="M110 200H196" class="signal"/>
  <rect x="198" y="170" width="217" height="61" rx="12" class="ctrl"/>
  <text x="218" y="196" class="head">Wave / wake control</text>
  <text x="219" y="218" class="small">1-cycle leading PE wake</text>
  <path d="M415 200H855" class="signal"/>
  <text x="867" y="207" class="mono">PE_on out</text>
  <path d="M529 200V290" class="signal"/>
  <rect x="469" y="287" width="125" height="53" rx="10" class="ctrl"/>
  <text x="488" y="319" class="body">PE gate</text>
  <path d="M532 340V360" class="signal"/>

  <!-- Activation / partial-sum path. -->
  <text x="27" y="403" class="mono">A in</text>
  <path d="M86 396H199" class="wire"/>
  <rect x="200" y="360" width="149" height="72" rx="12" class="logic"/>
  <text x="224" y="391" class="head">Activation</text>
  <text x="240" y="416" class="body">register</text>
  <path d="M349 396H466" class="wire"/>
  <rect x="468" y="359" width="128" height="74" rx="12" class="logic"/>
  <text x="505" y="391" class="head">MAC</text>
  <text x="485" y="417" class="small">compute logic</text>
  <path d="M596 396H737" class="wire"/>
  <rect x="739" y="360" width="179" height="72" rx="12" class="logic"/>
  <text x="762" y="391" class="head">Partial-sum</text>
  <text x="792" y="416" class="body">register</text>
  <path d="M918 396H1069" class="wire"/>
  <text x="1082" y="403" class="mono">S out</text>
  <path d="M275 432V467H1067" class="wire"/>
  <text x="1082" y="474" class="mono">A out</text>
  <text x="766" y="339" class="small">partial sum from PE above</text>
  <path d="M832 344V358" class="wire"/>

  <!-- Independent weight storage and selector. -->
  <rect x="223" y="531" width="230" height="88" rx="12" class="bank"/>
  <text x="274" y="563" class="head">Weight bank 0</text>
  <text x="253" y="590" class="small">ON  /  DS  /  OFF</text>
  <rect x="610" y="531" width="230" height="88" rx="12" class="bank"/>
  <text x="660" y="563" class="head">Weight bank 1</text>
  <text x="640" y="590" class="small">ON  /  DS  /  OFF</text>
  <rect x="464" y="491" width="130" height="57" rx="12" class="bank"/>
  <text x="489" y="525" class="head">Select</text>
  <path d="M453 575H464V520" class="weight"/>
  <path d="M610 575H594V520" class="weight"/>
  <path d="M529 491V434" class="weight"/>
  <text x="873" y="551" class="small">Only the selected bank feeds the MAC.</text>
  <text x="873" y="578" class="small">Bank 0 and bank 1 keep separate states.</text>

  <text x="221" y="654" class="label">Preload writes mapped rows to the assigned bank; unused weight positions can remain OFF.</text>
  <rect x="102" y="706" width="1076" height="49" rx="9" fill="#eef2f6"/>
  <text x="122" y="737" class="small">Conceptual model: bank DS wake is assumed hidden by PE wake; this is not a transistor-level circuit implementation.</text>
</svg>
